<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NC FPIC Calculator</title>
  <meta name="description" content="A free calculator that shows which of the 17 North Carolina LGC Financial Performance Indicators a city, town, or county would trigger, based on numbers from its audit. Runs entirely in your browser." />
  <link rel="icon" type="image/x-icon" href="../favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="NC FPIC Calculator" />
  <meta property="og:description" content="Check which of the 17 NC LGC Financial Performance Indicators a local government would trigger. Runs entirely in your browser." />
  <link rel="stylesheet" href="style.css?v=0.6.0" />
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; min-height: 100%; }
    .fpic-app { min-height: 100vh; padding: 24px 0 48px; box-sizing: border-box; }
    .fpic-credit {
      max-width: 1120px; margin: 32px auto 0; padding: 0 16px;
      font: 13px/1.6 "Open Sans", "FPIC Open Sans", Arial, sans-serif; color: #5b6670;
    }
    .fpic-credit a { color: #007fae; text-underline-offset: 2px; }
    @media print { .fpic-credit { display: none; } .fpic-app { padding: 0; } }
  </style>
</head>
<body>
  <main class="fpic-app">
    <div class="fpic-calc" data-fpic-calculator>
      <noscript>This calculator needs JavaScript to run. Please enable JavaScript in your browser and reload the page.</noscript>
    </div>
    <p class="fpic-credit">Built by <a href="/">Zane Davis</a>. Everything runs in your browser; nothing you enter is saved or sent anywhere.</p>
  </main>

  <!-- Load threshold data (single source: data/fpic-data.json), then start the calculator. -->
  <script>
    (function () {
      var mount = document.querySelector('[data-fpic-calculator]');
      function fail() {
        mount.textContent = 'The calculator data could not be loaded. Please reload the page.';
      }
      fetch('data/fpic-data.json?v=0.6.0')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (data) {
          window.FPIC_DATA = data;
          var s = document.createElement('script');
          s.src = 'script.js?v=0.6.0';
          s.onerror = fail;
          document.body.appendChild(s);
        })
        .catch(fail);
    })();
  </script>
</body>
</html>
